version: "2.38.1"

services:
  db:
    container_name: db
    image: postgres:17.6-alpine
    volumes:
      - db-data:/var/lib/postgresql
    restart: always
    network_mode: host
  redis:
    container_name: redis
    image: valkey:14.1-alpine
    restart: always
    network_mode: host

volumes:
  db-data:
    external: false
