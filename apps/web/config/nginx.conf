worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Compression
    gzip on;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=dynamic:10m rate=1000r/m;
    limit_req zone=dynamic burst=1000 nodelay;

    # Logging
    log_format json '{"time": "$time_iso8601", "remote_addr": "$remote_addr", "request": "$request", "status": $status, "body_bytes_sent": $body_bytes_sent, "http_referer": "$http_referer", "http_user_agent": "$http_user_agent"}';
    access_log /var/log/access.log json;

    server {
        listen 80;
        root /srv/app;

        # Global headers
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';";
        add_header Permissions-Policy interest-cohort=();
        add_header Strict-Transport-Security max-age=31556952;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # Location for /sw.js
        location = /sw.js {
            try_files /sw.js =404;
            add_header Cache-Control "public, no-cache, max-age=0";
            add_header Content-Type application/javascript;
        }

        # Location for immutable assets
        location ~* \.(js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Content-Type application/javascript;
        }

        location ~* \.(css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Content-Type text/css;
        }

        # Location for other static assets
        location ~* \.(txt|xml|jpg|jpeg|json|svg|png)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";

            types {
              text/plain       txt;
              application/xml  xml;
              image/jpeg       jpg jpeg;
              application/json json;
              image/svg+xml    svg;
              image/png        png;
            }
        }

        # Default location
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Health check
        location = /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }
    }
}
