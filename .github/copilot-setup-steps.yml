# Setup steps for GitHub Copilot coding agent
# These steps run before Copilot executes any commands in pull request sessions
# Docs: https://docs.github.com/en/copilot/customizing-copilot/extending-copilot-coding-agent
#
# IMPORTANT: This file MUST complete successfully before Copilot can run any commands.
# Without these steps, pnpm, turbo, and tsx will not be available.

steps:
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22"

  - name: Install pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Install global CLI tools (turbo, tsx)
    run: npm install -g turbo tsx

  - name: Install project dependencies
    run: pnpm install --frozen-lockfile

  - name: Build shared packages
    run: pnpm --filter @packages/shared-ui build
