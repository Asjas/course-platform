name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"

permissions:
  contents: read

jobs:
  check-format-lint-and-type-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 23.x, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache ESLint and Prettier
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-
            ${{ runner.os }}-lint-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm check-format

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

  e2e-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @apps/web build

      - name: Install Cypress
        run: pnpx cypress install
        working-directory: apps/web

      - name: Cache Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-${{ matrix.node-version }}-

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/web
          install: false
          start: pnpm --filter @apps/web preview
          wait-on: "http://localhost:4173"
          wait-on-timeout: 10

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.node-version }}
          path: apps/web/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ matrix.node-version }}
          path: apps/web/cypress/videos
          if-no-files-found: ignore
          retention-days: 7
