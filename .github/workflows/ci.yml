name: CI

on:
  workflow_dispatch: # allow manual triggering of the workflow
  push:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: codewizard
  VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
  VITE_TRPC_URL: ${{ vars.VITE_TRPC_URL }}
  PORT: ${{ vars.PORT }}
  HOST: ${{ vars.HOST }}
  ORIGIN: ${{ vars.ORIGIN }}
  COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
  COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  LEARN_FASTIFY_POLAR_PRODUCT_ID: ${{ secrets.LEARN_FASTIFY_POLAR_PRODUCT_ID }}
  POLAR_SUCCESS_URL: ${{ vars.POLAR_SUCCESS_URL }}
  POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  PEPPER_SECRET: ${{ secrets.PEPPER_SECRET }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_PORT: ${{ vars.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  SUPPORT_ASSIGNED_TO_USER_ID: ${{ vars.SUPPORT_ASSIGNED_TO_USER_ID }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

jobs:
  check-format-lint-and-type-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache ESLint and Prettier
        uses: actions/cache@v5
        with:
          path: .cache
          key: ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-
            ${{ runner.os }}-lint-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --cache=remote:rw

      - name: Run Prettier check
        run: pnpm check-format

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

  server-tests:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators)
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --cache=remote:rw

      - name: Run database migrations
        run: pnpm --filter @apps/server drizzle:migrate

      - name: Seed test database
        run: pnpm tsx scripts/seed-test-data.ts "my_schema"

      - name: Run server tests with coverage
        run: pnpm --filter @apps/server test:coverage

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-unit-coverage-node${{ matrix.node-version }}
          path: apps/server/coverage/unit
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts "my_schema"

  web-tests:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators)
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --cache=remote:rw

      - name: Run database migrations
        run: pnpm --filter @apps/server drizzle:migrate

      - name: Seed test database
        run: pnpm tsx scripts/seed-test-data.ts "my_schema"

      - name: Run web tests with coverage
        run: pnpm --filter @apps/web test:coverage

      - name: Upload web coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-unit-coverage-node${{ matrix.node-version }}
          path: apps/web/coverage/unit
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts "my_schema"

  e2e-tests:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 2
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-${{ matrix.node-version }}-

      - name: Build
        env:
          VITE_BETTER_AUTH_URL: http://localhost:3000
          VITE_TRPC_URL: http://localhost:3000/trpc
        run: pnpm build --cache=remote:rw

      - name: Run database migrations
        run: pnpm --filter @apps/server drizzle:migrate

      - name: Install Cypress
        run: pnpx cypress install
        working-directory: apps/web

      - name: Start backend server in background
        env:
          CI: true
        run: |
          pnpm --filter @apps/server dev > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Check server started successfully
        run: |
          echo "=== Backend Server Startup Logs ==="
          cat server.log
          echo "=== Checking health endpoint ==="
          curl -v http://localhost:3000/health || echo "Health check failed"

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          NO_DBUS: 1
        with:
          working-directory: apps/web
          install: false
          start: pnpm --filter @apps/web preview
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          browser: chrome

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.node-version }}
          path: apps/web/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-${{ matrix.node-version }}
          path: apps/web/cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Show server logs on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Backend Server Logs ==="
            cat server.log
          fi

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts "my_schema" || true
