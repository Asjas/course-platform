name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js with node_modules cache
        id: node-with-cache
        uses: magnetikonline/action-node-modules-cache@v2
        with:
          additional-cache-path: |
            .cache
      - name: Install pnpm packages
        if: steps.node-with-cache.outputs.cache-hit != 'true'
        run: pnpm ci

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm check-format

      - name: Run ESLint
        run: pnpm lint
