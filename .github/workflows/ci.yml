name: CI

on:
  workflow_dispatch: # allow manual triggering of the workflow
  push:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: codewizard
  VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
  VITE_TRPC_URL: ${{ vars.VITE_TRPC_URL }}
  PORT: ${{ vars.PORT }}
  HOST: ${{ vars.HOST }}
  ORIGIN: ${{ vars.ORIGIN }}
  COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
  COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  LEARN_FASTIFY_POLAR_PRODUCT_ID: ${{ secrets.LEARN_FASTIFY_POLAR_PRODUCT_ID }}
  POLAR_SUCCESS_URL: ${{ vars.POLAR_SUCCESS_URL }}
  POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  PEPPER_SECRET: ${{ secrets.PEPPER_SECRET }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_PORT: ${{ vars.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  SUPPORT_ASSIGNED_TO_USER_ID: ${{ vars.SUPPORT_ASSIGNED_TO_USER_ID }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

jobs:
  check-format-lint-and-type-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache ESLint and Prettier
        uses: actions/cache@v5
        with:
          path: .cache
          key: ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-
            ${{ runner.os }}-lint-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --cache=remote:rw

      - name: Run Prettier check
        run: pnpm check-format

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

  server-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators)
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --cache=remote:rw

      - name: Run database migrations
        run: pnpm --filter @apps/server drizzle:migrate

      - name: Seed test database
        run: pnpm tsx scripts/seed-test-data.ts "my_schema"

      - name: Run server tests
        run: pnpm --filter @apps/server test

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts "my_schema"

  web-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators)
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build --cache=remote:rw

      - name: Run database migrations
        run: pnpm --filter @apps/server drizzle:migrate

      - name: Seed test database
        run: pnpm tsx scripts/seed-test-data.ts "my_schema"

      - name: Run web tests
        run: pnpm --filter @apps/web test

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts "my_schema"

  e2e-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-${{ matrix.node-version }}-

      - name: Build
        env:
          VITE_BETTER_AUTH_URL: http://localhost:3000
          VITE_TRPC_URL: http://localhost:3000/trpc
        run: pnpm build --cache=remote:rw

      - name: Run database migrations
        run: pnpm --filter @apps/server drizzle:migrate

      # DEBUG: Verify environment variables before seeding
      - name: Debug - Check environment variables
        run: |
          echo "=== DEBUG: Environment Variable Check ==="
          echo "PEPPER_SECRET is set: ${PEPPER_SECRET:+yes}"
          echo "PEPPER_SECRET length: ${#PEPPER_SECRET}"
          echo "DATABASE_URL is set: ${DATABASE_URL:+yes}"
          echo "BETTER_AUTH_SECRET is set: ${BETTER_AUTH_SECRET:+yes}"
          echo "Current working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "=== END DEBUG ==="

      - name: Seed test database with E2E users
        run: pnpm tsx scripts/seed-test-data.ts "my_schema"

      # DEBUG: Verify seeded data
      - name: Debug - Verify seeded users and passwords
        run: |
          echo "=== DEBUG: Checking Seeded Data ==="
          pnpm tsx << 'EOF'
          import pg from 'pg';
          const { Pool } = pg;
          
          const databaseUrl = process.env.DATABASE_URL || 'postgresql://localhost:5432/course_platform';
          const connectionString = databaseUrl.includes('?') 
            ? `${databaseUrl}&options=-c%20search_path%3Dmy_schema`
            : `${databaseUrl}?options=-c%20search_path%3Dmy_schema`;
          
          const pool = new Pool({ connectionString });
          
          async function checkData() {
            const client = await pool.connect();
            try {
              // Check users
              const usersResult = await client.query('SELECT id, email, name, role FROM "user" WHERE id != \'ghost\' ORDER BY created_at LIMIT 5');
              console.log('Users in database:', usersResult.rows);
              
              // Check accounts (with passwords)
              const accountsResult = await client.query('SELECT id, account_id, provider_id, user_id, LEFT(password, 20) as password_prefix FROM account LIMIT 5');
              console.log('Accounts in database:', accountsResult.rows);
              
              // Verify test user exists
              const testUser = await client.query('SELECT * FROM "user" WHERE email = \'test@example.com\'');
              console.log('Test user exists:', testUser.rows.length > 0);
              
              // Verify test user has account
              const testAccount = await client.query('SELECT id, account_id, provider_id FROM account WHERE account_id = \'test@example.com\'');
              console.log('Test user account exists:', testAccount.rows.length > 0, testAccount.rows);
              
            } finally {
              client.release();
              await pool.end();
            }
          }
          
          checkData().catch(console.error);
          EOF
          echo "=== END DEBUG ==="

      - name: Install Cypress
        run: pnpx cypress install
        working-directory: apps/web

      - name: Start backend server in background
        run: |
          pnpm --filter @apps/server dev > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Check server started successfully
        run: |
          echo "=== Backend Server Startup Logs ==="
          cat server.log
          echo "=== Checking health endpoint ==="
          curl -v http://localhost:3000/health || echo "Health check failed"
          echo "=== Checking auth session endpoint ==="
          curl -v http://localhost:3000/api/auth/get-session || echo "Auth session check failed"

      # DEBUG: Test authentication manually before Cypress
      - name: Debug - Test authentication manually
        run: |
          echo "=== DEBUG: Manual Authentication Test ==="
          # Try to sign in with test user
          RESPONSE=$(curl -v -X POST http://localhost:3000/api/auth/sign-in/email \
            -H "Content-Type: application/json" \
            -d '{"email": "test@example.com", "password": "password123"}' \
            -c cookies.txt \
            2>&1)
          echo "Sign in response:"
          echo "$RESPONSE"
          echo ""
          echo "Cookies saved:"
          cat cookies.txt || echo "No cookies saved"
          echo ""
          # Try to get session
          SESSION_RESPONSE=$(curl -v http://localhost:3000/api/auth/get-session \
            -b cookies.txt \
            2>&1)
          echo "Session response:"
          echo "$SESSION_RESPONSE"
          echo "=== END DEBUG ==="

      - name: Cypress run
        uses: cypress-io/github-action@v6
        env:
          NO_DBUS: 1
          # DEBUG: Enable Cypress debug mode
          DEBUG: cypress:*
          CYPRESS_DEBUG: true
        with:
          working-directory: apps/web
          install: false
          start: pnpm --filter @apps/web preview
          wait-on: "http://localhost:4173"
          wait-on-timeout: 120
          browser: chrome

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Show server logs on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Backend Server Logs ==="
            cat server.log
          fi

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts "my_schema" || true
