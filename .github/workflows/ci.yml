name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"

permissions:
  contents: read

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [19.x, 20.x, 21.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm check-format

      - name: Run ESLint
        run: pnpm lint
