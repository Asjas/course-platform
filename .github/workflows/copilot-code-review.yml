name: Copilot Code Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - name: Copilot Code Review
        uses: github/copilot-code-review@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
