name: Secret Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: for Gitleaks Pro

      - name: Comment on PR (if secrets found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `⚠️ **Security Alert: Potential secrets detected!**

            Gitleaks has detected potential secrets in this pull request.

            **Immediate Actions Required:**
            1. Review the detected secrets in the workflow logs
            2. Remove any actual secrets from your code
            3. If real secrets were committed:
               - Revoke/regenerate the compromised credentials immediately
               - Follow the [API Key Security Guide](../blob/main/docs/SECURITY-API-KEYS.md)
            4. Use environment variables instead of hardcoding secrets

            **Prevention:**
            - Store secrets in \`.env\` files (already gitignored)
            - Use \`.env.sample\` for documentation
            - Install pre-commit hooks: \`pnpm run prepare\`

            See: [SECURITY-API-KEYS.md](../blob/main/docs/SECURITY-API-KEYS.md) for detailed guidance.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
