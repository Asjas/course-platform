name: CI Build

on:
  workflow_dispatch: # allow manual triggering of the workflow
  push:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/chatmodes/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
      - ".editorconfig"
      - ".npmrc"
      - ".env.sample"
      - ".dockerignore"
      - "docker-compose.yml"
      - "renovate.json"
      - "LICENSE"

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: codewizard
  VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
  VITE_TRPC_URL: ${{ vars.VITE_TRPC_URL }}
  PORT: ${{ vars.PORT }}
  HOST: ${{ vars.HOST }}
  ORIGIN: ${{ vars.ORIGIN }}
  COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
  COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
  LEARN_FASTIFY_POLAR_PRODUCT_ID: ${{ secrets.LEARN_FASTIFY_POLAR_PRODUCT_ID }}
  POLAR_SUCCESS_URL: ${{ vars.POLAR_SUCCESS_URL }}
  POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  PEPPER_SECRET: ${{ secrets.PEPPER_SECRET }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_PORT: ${{ vars.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  SUPPORT_ASSIGNED_TO_USER_ID: ${{ vars.SUPPORT_ASSIGNED_TO_USER_ID }}
  REDIS_HOST: ${{ secrets.REDIS_HOST }}
  REDIS_PORT: ${{ secrets.REDIS_PORT }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

jobs:
  check-format-lint-type-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 25.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Cache ESLint and Prettier
        uses: actions/cache@v5
        with:
          path: .cache
          key: ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml', 'eslint.config.mjs', '.prettierrc') }}
          restore-keys: |
            ${{ runner.os }}-lint-cache-${{ matrix.node-version }}-
            ${{ runner.os }}-lint-cache-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm check-format

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

      - name: Run build
        run: pnpm build

  server-tests:
    runs-on: ubuntu-latest
    needs: check-format-lint-type-and-build

    strategy:
      matrix:
        # Use include-only matrix to guarantee every job has a unique redis-db value.
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators).
        include:
          - node-version: 22
            redis-db: 1
          - node-version: 24
            redis-db: 2
          - node-version: 25
            redis-db: 3

    env:
      DATABASE_SCHEMA: ci_server_${{ matrix.node-version }}_${{ github.run_id }}_${{ github.run_attempt }}
      REDIS_DB: ${{ matrix.redis-db || 0 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Run database migrations
        run: pnpm tsx scripts/ci-migrate.ts

      - name: Seed test database
        run: pnpm tsx scripts/seed-test-data.ts

      - name: Run server tests with coverage
        run: pnpm turbo run test:coverage --filter=@apps/server

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-unit-coverage-node${{ matrix.node-version }}
          path: apps/server/coverage/unit
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts

  web-tests:
    runs-on: ubuntu-latest
    needs: check-format-lint-type-and-build

    strategy:
      matrix:
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators)
        node-version: [22, 24, 25]

    env:
      DATABASE_SCHEMA: ci_web_${{ matrix.node-version }}_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm build

      - name: Run database migrations
        run: pnpm tsx scripts/ci-migrate.ts

      - name: Seed test database
        run: pnpm tsx scripts/seed-test-data.ts

      - name: Run web tests with coverage
        run: pnpm turbo run test:coverage --filter=@apps/web

      - name: Upload web coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-unit-coverage-node${{ matrix.node-version }}
          path: apps/web/coverage/unit
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts

  e2e-tests:
    runs-on: ubuntu-latest
    needs: check-format-lint-type-and-build
    # Full E2E suite runs only on pushes to main and manual workflow triggers.
    # Pull requests use the e2e-tests-pr job which runs only affected specs.
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        # Use include-only matrix to guarantee every job has a unique redis-db value.
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators).
        include:
          - node-version: 22
            redis-db: 4
          - node-version: 24
            redis-db: 5
          - node-version: 25
            redis-db: 6

    env:
      DATABASE_SCHEMA: ci_e2e_${{ matrix.node-version }}_${{ github.run_id }}_${{ github.run_attempt }}
      REDIS_DB: ${{ matrix.redis-db || 0 }}
      CYPRESS_COVERAGE: ${{ matrix.node-version == 22 && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-${{ matrix.node-version }}-

      - name: Run build
        env:
          VITE_BETTER_AUTH_URL: http://localhost:3000
          VITE_TRPC_URL: http://localhost:3000/trpc
        run: pnpm build

      - name: Run database migrations
        run: pnpm tsx scripts/ci-migrate.ts

      - name: Seed test data (creates ghost user and base fixtures)
        run: pnpm tsx scripts/seed-test-data.ts

      - name: Install Cypress
        run: pnpx cypress install
        working-directory: apps/web

      - name: Start backend server in background
        env:
          CI: true
        run: |
          pnpm --filter @apps/server dev > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Check server started successfully
        run: |
          echo "=== Backend Server Startup Logs ==="
          cat server.log
          echo "=== Checking health endpoint ==="
          curl -v http://localhost:3000/health || echo "Health check failed"

      - name: Start frontend preview in background
        env:
          CI: true
        run: |
          pnpm --filter @apps/web preview > web.log 2>&1 &
          echo $! > web.pid

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:4173 --timeout 120000

      - name: Cypress E2E tests
        env:
          NO_DBUS: 1
        run: pnpm --filter @apps/web run e2e:run -- --browser chrome

      - name: Generate E2E coverage report
        if: always()
        working-directory: apps/web
        run: |
          if [ ! -d ".nyc_output" ] || [ -z "$(ls -A .nyc_output 2>/dev/null || true)" ]; then
            echo "No NYC coverage output found in .nyc_output; skipping E2E coverage report."
            exit 0
          fi
          pnpm e2e:coverage:report

      - name: Upload E2E coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-coverage-node${{ matrix.node-version }}
          path: apps/web/coverage/e2e
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload E2E NYC raw output (for PR coverage merge)
        uses: actions/upload-artifact@v4
        if: always() && matrix.node-version == 22
        with:
          name: web-e2e-nyc-output-node${{ matrix.node-version }}
          path: apps/web/.nyc_output
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.node-version }}
          path: apps/web/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-${{ matrix.node-version }}
          path: apps/web/cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Stop frontend preview
        if: always()
        run: |
          if [ -f web.pid ]; then
            kill $(cat web.pid) || true
          fi

      - name: Show server logs on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Backend Server Logs ==="
            cat server.log
          fi

      - name: Show frontend logs on failure
        if: failure()
        run: |
          if [ -f web.log ]; then
            echo "=== Frontend Preview Logs ==="
            cat web.log
          fi

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts || true

  e2e-tests-pr:
    runs-on: ubuntu-latest
    needs: check-format-lint-type-and-build
    # Minimal E2E suite for pull requests: only runs specs affected by the PR's changes.
    # The full suite runs on pushes to main via the e2e-tests job.
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        # Use include-only matrix to guarantee every job has a unique redis-db value.
        # Use major version numbers only to avoid dots in schema names (PostgreSQL interprets dots as schema separators).
        include:
          - node-version: 22
            redis-db: 4
          - node-version: 24
            redis-db: 5
          - node-version: 25
            redis-db: 6

    env:
      DATABASE_SCHEMA: ci_e2e_pr_${{ matrix.node-version }}_${{ github.run_id }}_${{ github.run_attempt }}
      REDIS_DB: ${{ matrix.redis-db || 0 }}
      CYPRESS_COVERAGE: ${{ matrix.node-version == 22 && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history required so git diff can compare the PR branch against
          # the base branch (origin/<base_ref>) to determine changed files.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine changed E2E specs
        id: changed-specs
        run: pnpm tsx scripts/get-changed-e2e-specs.ts
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Download base E2E NYC output (seed for full coverage merge)
        if: steps.changed-specs.outputs.specs != 'skip' && matrix.node-version == 22
        uses: dawidd6/action-download-artifact@v8
        continue-on-error: true
        with:
          workflow: ci-build.yml
          branch: main
          name: web-e2e-nyc-output-node22
          path: apps/web/.nyc_output
          if_no_artifact_found: warn
          check_artifacts: true
          search_artifacts: true

      - name: Cache Cypress
        if: steps.changed-specs.outputs.specs != 'skip'
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-${{ matrix.node-version }}-

      - name: Run build
        if: steps.changed-specs.outputs.specs != 'skip'
        env:
          VITE_BETTER_AUTH_URL: http://localhost:3000
          VITE_TRPC_URL: http://localhost:3000/trpc
        run: pnpm build

      - name: Run database migrations
        if: steps.changed-specs.outputs.specs != 'skip'
        run: pnpm tsx scripts/ci-migrate.ts

      - name: Seed test data (creates ghost user and base fixtures)
        if: steps.changed-specs.outputs.specs != 'skip'
        run: pnpm tsx scripts/seed-test-data.ts

      - name: Install Cypress
        if: steps.changed-specs.outputs.specs != 'skip'
        run: pnpx cypress install
        working-directory: apps/web

      - name: Start backend server in background
        if: steps.changed-specs.outputs.specs != 'skip'
        env:
          CI: true
        run: |
          pnpm --filter @apps/server dev > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend to be ready
        if: steps.changed-specs.outputs.specs != 'skip'
        run: npx wait-on http://localhost:3000/health --timeout 60000

      - name: Check server started successfully
        if: steps.changed-specs.outputs.specs != 'skip'
        run: |
          echo "=== Backend Server Startup Logs ==="
          cat server.log
          echo "=== Checking health endpoint ==="
          curl -v http://localhost:3000/health || echo "Health check failed"

      - name: Start frontend preview in background
        if: steps.changed-specs.outputs.specs != 'skip'
        env:
          CI: true
        run: |
          pnpm --filter @apps/web preview > web.log 2>&1 &
          echo $! > web.pid

      - name: Wait for frontend to be ready
        if: steps.changed-specs.outputs.specs != 'skip'
        run: npx wait-on http://localhost:4173 --timeout 120000

      - name: Cypress E2E tests (minimal - affected specs only)
        if: steps.changed-specs.outputs.specs != 'skip'
        env:
          NO_DBUS: 1
          CYPRESS_SPECS: ${{ steps.changed-specs.outputs.specs }}
        run: |
          if [ -n "$CYPRESS_SPECS" ]; then
            pnpm --filter @apps/web exec cypress run --browser chrome --spec "$CYPRESS_SPECS"
          else
            pnpm --filter @apps/web exec cypress run --browser chrome
          fi

      - name: Generate E2E coverage report
        if: always() && steps.changed-specs.outputs.specs != 'skip'
        working-directory: apps/web
        run: |
          if [ ! -d ".nyc_output" ] || [ -z "$(ls -A .nyc_output 2>/dev/null || true)" ]; then
            echo "No NYC coverage output found in .nyc_output; skipping E2E coverage report."
            exit 0
          fi
          pnpm e2e:coverage:report

      - name: Upload E2E coverage
        uses: actions/upload-artifact@v4
        if: always() && steps.changed-specs.outputs.specs != 'skip'
        with:
          name: web-e2e-coverage-node${{ matrix.node-version }}
          path: apps/web/coverage/e2e
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure() && steps.changed-specs.outputs.specs != 'skip'
        with:
          name: cypress-screenshots-pr-${{ matrix.node-version }}
          path: apps/web/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: failure() && steps.changed-specs.outputs.specs != 'skip'
        with:
          name: cypress-videos-pr-${{ matrix.node-version }}
          path: apps/web/cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop backend server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Stop frontend preview
        if: always()
        run: |
          if [ -f web.pid ]; then
            kill $(cat web.pid) || true
          fi

      - name: Show server logs on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== Backend Server Logs ==="
            cat server.log
          fi

      - name: Show frontend logs on failure
        if: failure()
        run: |
          if [ -f web.log ]; then
            echo "=== Frontend Preview Logs ==="
            cat web.log
          fi

      - name: Cleanup test database
        if: always()
        run: pnpm tsx scripts/cleanup-test-data.ts || true

  coverage-report:
    runs-on: ubuntu-latest
    needs: [server-tests, web-tests, e2e-tests-pr]
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}

    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Download server unit coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server-unit-coverage-node22
          path: coverage/server-unit

      - name: Download web unit coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-unit-coverage-node22
          path: coverage/web-unit

      - name: Download web E2E coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-e2e-coverage-node22
          path: coverage/web-e2e

      - name: Download base server unit coverage
        uses: dawidd6/action-download-artifact@v8
        continue-on-error: true
        with:
          workflow: ci-build.yml
          branch: main
          name: server-unit-coverage-node22
          path: base-coverage/server-unit
          if_no_artifact_found: warn
          check_artifacts: true
          search_artifacts: true

      - name: Download base web unit coverage
        uses: dawidd6/action-download-artifact@v8
        continue-on-error: true
        with:
          workflow: ci-build.yml
          branch: main
          name: web-unit-coverage-node22
          path: base-coverage/web-unit
          if_no_artifact_found: warn
          check_artifacts: true
          search_artifacts: true

      - name: Download base web E2E coverage
        uses: dawidd6/action-download-artifact@v8
        continue-on-error: true
        with:
          workflow: ci-build.yml
          branch: main
          name: web-e2e-coverage-node22
          path: base-coverage/web-e2e
          if_no_artifact_found: warn
          check_artifacts: true
          search_artifacts: true

      - name: Check coverage file availability
        id: coverage-files
        run: |
          [ -f coverage/server-unit/coverage-summary.json ] && [ -f coverage/server-unit/coverage-final.json ] && echo "server-unit=true" >> "$GITHUB_OUTPUT"
          [ -f coverage/web-unit/coverage-summary.json ] && [ -f coverage/web-unit/coverage-final.json ] && echo "web-unit=true" >> "$GITHUB_OUTPUT"
          [ -f coverage/web-e2e/coverage-summary.json ] && [ -f coverage/web-e2e/coverage-final.json ] && echo "web-e2e=true" >> "$GITHUB_OUTPUT"
          [ -f base-coverage/server-unit/coverage-summary.json ] && echo "base-server-unit=true" >> "$GITHUB_OUTPUT"
          [ -f base-coverage/web-unit/coverage-summary.json ] && echo "base-web-unit=true" >> "$GITHUB_OUTPUT"
          [ -f base-coverage/web-e2e/coverage-summary.json ] && echo "base-web-e2e=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Server unit test coverage report
        if: steps.coverage-files.outputs.server-unit == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Server Unit Tests
          json-summary-path: coverage/server-unit/coverage-summary.json
          json-final-path: coverage/server-unit/coverage-final.json
          json-summary-compare-path: ${{ steps.coverage-files.outputs.base-server-unit == 'true' && 'base-coverage/server-unit/coverage-summary.json' || '' }}

      - name: Web unit test coverage report
        if: steps.coverage-files.outputs.web-unit == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web Unit Tests
          json-summary-path: coverage/web-unit/coverage-summary.json
          json-final-path: coverage/web-unit/coverage-final.json
          json-summary-compare-path: ${{ steps.coverage-files.outputs.base-web-unit == 'true' && 'base-coverage/web-unit/coverage-summary.json' || '' }}

      - name: Web E2E test coverage report
        if: steps.coverage-files.outputs.web-e2e == 'true'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web E2E Tests
          json-summary-path: coverage/web-e2e/coverage-summary.json
          json-final-path: coverage/web-e2e/coverage-final.json
          json-summary-compare-path: ${{ steps.coverage-files.outputs.base-web-e2e == 'true' && 'base-coverage/web-e2e/coverage-summary.json' || '' }}
